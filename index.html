<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="light" />
    <link rel="icon" type="image/png" href="frontend/src/assets/scriptcut-icon.png" />
    <title>ScriptSurgeon</title>
    <style>
      body { margin: 0; min-height: 100vh; display: flex; align-items: center; justify-content: center;
             background: #fdfaf5; color: #241f1b; font-family: "Segoe UI", system-ui, sans-serif; }
      .card { max-width: 560px; padding: 2.5rem; text-align: center; border: 1px solid #e1d8cc;
              border-radius: 24px; background: #fffdf9; box-shadow: 0 24px 70px rgba(65,49,37,.13); }
      img { width: 72px; height: 72px; border-radius: 18px; }
      h1 { font-size: 2rem; margin-bottom: .5rem; }
      p { color: #6f675e; line-height: 1.6; }
      code { background: #fbe9df; padding: .15rem .5rem; border-radius: .35rem; color: #b94e34; }
    </style>
  </head>
  <body>
    <div class="card">
      <img src="frontend/src/assets/scriptcut-icon.png" alt="" />
      <h1>ScriptSurgeon</h1>
      <p>The transcript-driven audio editor is starting. Refresh in a moment.</p>
      <p>For a development run, use <code>start.bat</code> on Windows or <code>./start.sh</code> on macOS/Linux.</p>
    </div>
  </body>
</html>
